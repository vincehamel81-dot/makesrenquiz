# Render Blueprint — https://render.com/docs/blueprint-spec
# Connecting this repo as a Blueprint on Render reads this file and
# provisions the web service + persistent disk automatically.
services:
  - type: web
    name: renquiz
    runtime: node
    plan: starter
    # --include=dev: vite (needed for the build step) is a devDependency,
    # and Render's build environment sets NODE_ENV=production by default,
    # which would otherwise skip installing it.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DB_PATH
        value: /data/renquiz.db
      - key: AUDIO_DIR
        value: /data/audio
    disk:
      name: renquiz-data
      mountPath: /data
      sizeGB: 2
